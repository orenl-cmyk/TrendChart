<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>ניקוד אישי מול ממוצע חודשי</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: right;
      margin-bottom: 20px;
    }

    .chart-wrapper {
      max-width: 1200px;
      margin: auto;
    }
  </style>
</head>
<body>

<h1>ניקוד אישי מול ממוצע חודשי – דמו צבעים</h1>

<div class="chart-wrapper">
  <canvas id="trendChart"></canvas>
</div>

<script>
/* =========================
   DATA (סטטי מה-JSON)
   ========================= */

const data = [
  { month: "01/2026", average: 75, personal: 85 },
  { month: "02/2026", average: 68, personal: 73 },
  { month: "03/2026", average: 61, personal: 58 },
  { month: "04/2026", average: 58, personal: 62 },
  { month: "05/2026", average: 59, personal: 61 },
  { month: "06/2026", average: 63, personal: 61 },
  { month: "07/2026", average: 57, personal: 61 },
  { month: "08/2026", average: 57, personal: 63 },
  { month: "09/2026", average: 63, personal: 72 },
  { month: "10/2026", average: 59, personal: 72 },
  { month: "11/2026", average: 69, personal: 69 },
  { month: "12/2026", average: 56, personal: 57 }
];

/* =========================
   COLOR SCALE HELPERS
   ========================= */

function lerp(a, b, t) {
  return Math.round(a + (b - a) * t);
}

function colorLerp(c1, c2, t) {
  return `rgb(${lerp(c1[0], c2[0], t)},
              ${lerp(c1[1], c2[1], t)},
              ${lerp(c1[2], c2[2], t)})`;
}

const COLOR_STOPS = [
  { t: 0.00, c: [25, 30, 120] },   // כחול כהה
  { t: 0.25, c: [120, 60, 180] },  // סגול
  { t: 0.50, c: [200, 60, 90] },   // אדום
  { t: 0.75, c: [255, 120, 40] },  // כתום
  { t: 1.00, c: [90, 170, 90] }    // ירוק
];

function getSmartColor(value, min, max) {
  if (max === min) return "rgb(120,120,200)";
  const t = (value - min) / (max - min);

  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    const a = COLOR_STOPS[i];
    const b = COLOR_STOPS[i + 1];
    if (t >= a.t && t <= b.t) {
      const localT = (t - a.t) / (b.t - a.t);
      return colorLerp(a.c, b.c, localT);
    }
  }
  return "rgb(0,0,0)";
}

/* =========================
   PREPARE SERIES
   ========================= */

const labels = data.map(d => d.month);
const averages = data.map(d => d.average);
const personals = data.map(d => d.personal);

const minVal = Math.min(...personals);
const maxVal = Math.max(...personals);

const personalColors = personals.map(v =>
  getSmartColor(v, minVal, maxVal)
);

/* =========================
   CHART
   ========================= */

new Chart(document.getElementById("trendChart"), {
  type: "bar",
  data: {
    labels,
    datasets: [
      {
        type: "bar",
        label: "ניקוד אישי",
        data: personals,
        backgroundColor: personalColors,
        borderRadius: 6
      },
      {
        type: "line",
        label: "ממוצע חודשי",
        data: averages,
        borderColor: "#333",
        backgroundColor: "#333",
        tension: 0.3,
        pointRadius: 4,
        pointHoverRadius: 5
      }
    ]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: "top"
      },
      tooltip: {
        callbacks: {
          label: ctx => `${ctx.dataset.label}: ${ctx.raw}`
        }
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        title: {
          display: true,
          text: "ניקוד"
        }
      }
    }
  }
});
</script>

</body>
</html>
