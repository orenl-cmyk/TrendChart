<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>ניקוד אישי מול ממוצע חודשי</title>

  <!-- Highcharts -->
  <script src="https://code.highcharts.com/highcharts.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #container {
      width: 100%;
      height: 520px;
    }
  </style>
</head>
<body>

<div id="container">טוען נתונים…</div>

<script>
/* =========================
   1. פרמטר מה-URL
   ========================= */
const params = new URLSearchParams(window.location.search);
const promoId = params.get("id");

if (!promoId) {
  document.getElementById("container").innerHTML =
    "<span style='color:red'>חסר פרמטר id ב-URL</span>";
  throw new Error("Missing id param");
}

/* =========================
   2. הגדרות API
   ========================= */
const API_URL = "https://shchori.origami.ms/entities/api/instance_data/format/json";

const REQUEST_BODY = {
  username: "orenl@pisgacyber.co.il",
  api_secret: "OGMI-NJK3MJFkNTUxZGR-HZTAtMJMXMzcXNZ-YzNZC2ODkXMDY5N-zIxZDU1MWRKYJQ3-LTM4NDk4MzCW",
  entity_data_name: "e_171",
  specific: 1,
  filter: [
    ["fld_3096", "=", promoId]
  ]
};

/* =========================
   3. חישוב טווח תאריכים
   ========================= */
const now = new Date();
const startDate = new Date(now.getFullYear(), now.getMonth() - 11, 1);

/* =========================
   4. קריאה ל-Origami
   ========================= */
fetch(API_URL, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify(REQUEST_BODY)
})
.then(res => res.json())
.then(res => {
  const rows =
    res?.data?.[0]?.field_groups?.[0]?.fields_data || [];

  /* =========================
     5. מיפוי + סינון שנה אחרונה
     ========================= */
  const data = rows
    .map(row => {
      const getVal = fld =>
        row.find(f => f.field_data_name === fld)?.value ?? null;

      const dateVal = getVal("fld_3020");
      if (!dateVal) return null;

      const d = new Date(dateVal);
      if (isNaN(d)) return null;
      if (d < startDate || d > now) return null;

      const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;

      return {
        month: monthKey,
        personal: Number(getVal("fld_3019")),
        avg: Number(getVal("fld_3018"))
      };
    })
    .filter(Boolean)
    .sort((a, b) => a.month.localeCompare(b.month));

  if (!data.length) {
    document.getElementById("container").innerHTML =
      "<span style='color:red'>אין נתונים לשנה האחרונה</span>";
    return;
  }

  /* =========================
     6. הכנה לגרף
     ========================= */
  const months   = data.map(d => d.month);
  const personal = data.map(d => d.personal);
  const avg      = data.map(d => d.avg);

  /* =========================
     7. ציור הגרף
     ========================= */
  Highcharts.chart('container', {
    title: {
      text: 'ניקוד אישי מול ממוצע חודשי'
    },
    xAxis: {
      categories: months,
      title: { text: 'חודש' }
    },
    yAxis: {
      title: { text: 'ניקוד' }
    },
    tooltip: {
      shared: true
    },
    series: [
      {
        type: 'column',
        name: 'ניקוד אישי',
        data: personal
      },
      {
        type: 'line',
        name: 'ממוצע חודשי',
        data: avg,
        marker: { enabled: true }
      }
    ],
    credits: { enabled: false }
  });
})
.catch(err => {
  console.error(err);
  document.getElementById("container").innerHTML =
    "<span style='color:red'>שגיאה בטעינת הנתונים</span>";
});
</script>

</body>
</html>
