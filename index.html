<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Trend Demo</title>
<script>
/* =========================
   0. קריאת פרמטר id מה-URL
   ========================= */
const params = new URLSearchParams(window.location.search);
const personId = params.get("id");

if (!personId) {
  document.body.innerHTML = `
    <h2 style="color:#b00020">❌ חסר פרמטר id ב-URL</h2>
    <p>יש לקרוא לדף כך:</p>
    <code>?id=XXXXXXXX</code>
  `;
  throw new Error("Missing id parameter");
}

// לדמו – רק נציג אותו
console.log("Trend for ID:", personId);
</script>

  <script src="https://code.highcharts.com/highcharts.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      margin: 0;
      padding: 20px;
      background: #fafafa;
    }
    #container {
      width: 100%;
      height: 540px;
    }
  </style>
</head>
<body>

<h2>ניקוד אישי מול ממוצע חודשי – דמו צבעים</h2>
<div id="container"></div>

<script>
/* =========================
   1. נתונים סטטיים (דמו)
   ========================= */
const data = [
  { month: "01/2026", personal: 85, avg: 75 },
  { month: "02/2026", personal: 73, avg: 68 },
  { month: "03/2026", personal: 58, avg: 61 },
  { month: "04/2026", personal: 62, avg: 58 },
  { month: "05/2026", personal: 61, avg: 59 },
  { month: "06/2026", personal: 61, avg: 63 },
  { month: "07/2026", personal: 61, avg: 57 },
  { month: "08/2026", personal: 63, avg: 57 },
  { month: "09/2026", personal: 72, avg: 63 },
  { month: "10/2026", personal: 72, avg: 59 },
  { month: "11/2026", personal: 69, avg: 69 },
  { month: "12/2026", personal: 57, avg: 56 }
];

/* =========================
   2. סקאלת צבעים מותאמת
   ========================= */
function lerp(a, b, t) {
  return Math.round(a + (b - a) * t);
}

function colorLerp(c1, c2, t) {
  return `rgb(
    ${lerp(c1[0], c2[0], t)},
    ${lerp(c1[1], c2[1], t)},
    ${lerp(c1[2], c2[2], t)}
  )`;
}

// צבעים בסיסיים
const COLD_MIN = [20, 30, 120];    // כחול כהה
const COLD_MAX = [140, 60, 180];   // סגול
const HOT_MIN  = [170, 40, 120];   // אדום-סגול
const HOT_MAX  = [255, 80, 40];    // כתום-אדום

function getColor(personal, avg) {
  const diff = personal - avg;
  const maxDiff = 20; // טווח נורמליזציה
  const t = Math.min(Math.abs(diff) / maxDiff, 1);

  if (diff < 0) {
    // מתחת לממוצע: כחול כהה → סגול
    return colorLerp(COLD_MIN, COLD_MAX, t);
  } else if (diff > 0) {
    // מעל הממוצע: אדום-סגול → כתום-אדום
    return colorLerp(HOT_MIN, HOT_MAX, t);
  } else {
    return "#999999";
  }
}

/* =========================
   3. הכנת סדרות
   ========================= */
const categories = data.map(d => d.month);

const personalSeries = data.map(d => ({
  y: d.personal,
  color: getColor(d.personal, d.avg)
}));

const avgSeries = data.map(d => d.avg);

/* =========================
   4. ציור הגרף
   ========================= */
Highcharts.chart('container', {
  title: {
    text: 'ניקוד אישי מול ממוצע חודשי'
  },
  xAxis: {
    categories: categories,
    title: { text: 'חודש' }
  },
  yAxis: {
    title: { text: 'ניקוד' }
  },
  tooltip: {
    shared: true,
    formatter: function () {
      const p = this.points[0].y;
      const a = this.points[1].y;
      const diff = p - a;
      const sign = diff > 0 ? "+" : "";
      return `
        <b>${this.x}</b><br/>
        אישי: <b>${p}</b><br/>
        ממוצע: <b>${a}</b><br/>
        פער: <b>${sign}${diff}</b>
      `;
    }
  },
  series: [
    {
      type: 'column',
      name: 'ניקוד אישי',
      data: personalSeries
    },
    {
      type: 'line',
      name: 'ממוצע חודשי',
      data: avgSeries,
      color: '#444',
      marker: { enabled: true }
    }
  ],
  credits: { enabled: false }
});
</script>

</body>
</html>
